function fmtCount(n){
  n=Math.max(0,Math.round(+n||0)); const t=(v,s)=>(Math.round(v*10)/10)+s;
  if(n>=1e9) return t(n/1e9,"B"); if(n>=1e6) return t(n/1e6,"M"); if(n>=1e3) return t(n/1e3,"K"); return String(n);
}
function parseCount(s){
  s=String(s).trim().toLowerCase().replace(/\s+/g,""); if(!s) return NaN;
  const m=s.match(/^([\d.,]+)([kmb]?)$/); if(!m) return NaN;
  let num=m[1]; const mul={"":1,k:1e3,m:1e6,b:1e9}[m[2]];
  if(m[2]) num=num.replace(",","."); else num=/^\d{1,3}([.,]\d{3})+$/.test(num)? num.replace(/[.,]/g,"") : num.replace(",",".");
  const v=parseFloat(num)*mul; return isFinite(v)&&v>=0? Math.round(v):NaN;
}

async function loadProfile(user){
  S.authUser=user; S.isAdmin=false; S.adminCode=null;

  if(!snap.exists()){

    await setDoc(uref,{email:normEmail(user.email),createdAt:now,lastLogin:now,logins:1,consent:now,banned:false});
    snap=await getDoc(uref);

  S.view=startView||(S.isAdmin?"admin":"projects"); S.tab="projects"; render();

});

function suspicion(u){
  const r=[]; const [loc,dom]=String(u.email||"@").split("@");
  if(DISPOSABLE.some(d=>(dom||"").includes(d))) r.push("Geçici e-posta servisi");
  const digits=(loc.match(/\d/g)||[]).length;
  if(loc.length>=8&&digits/loc.length>0.5) r.push("E-posta çoğunlukla rakam");
  if(loc.length>22) r.push("Çok uzun e-posta");
  if(/^[bcdfghjklmnpqrstvwxz]{7,}/i.test(loc)) r.push("Rastgele görünen e-posta");
  return r;
}

  }else if(mode==="register"){

      h("div",{class:"field"},h("label",{class:"l"},"Şifre"),pass,h("div",{class:"hint"},"En az 6 karakter.")),
      humanField,hp,consent,submit,
      h("div",{class:"admin-sep"},h("button",{class:"btn btn-ghost btn-block",onclick:()=>{S.authMode="adminreg";render();}},"👑 Admin Kayıt")),

  }else{

      h("div",{class:"field"},h("label",{class:"l"},"E-posta"),email),
      h("div",{class:"field"},h("label",{class:"l"},"Şifre"),pass,h("div",{class:"hint"},"En az 6 karakter.")),
      h("div",{class:"field"},h("label",{class:"l"},"Admin şifresi"),code),
      humanField,hp,consent,submit,
      h("div",{class:"switch"},h("a",{onclick:()=>{S.authMode="register";render();}},"← Normal kayda dön")));
  }
  const go=()=>{ mode==="login"?doLogin():doRegister(mode==="adminreg"); };
  submit.addEventListener("click",go);
  [email,pass,code,human].forEach(i=>i.addEventListener("keydown",e=>{ if(e.key==="Enter") go(); }));
  wrap.append(card,h("div",{class:"lock"},"🔒 Projeleri görmek için üye girişi zorunludur"));

  const lock=on=>{ submit.disabled=on; };
  async function doLogin(){
    const em=normEmail(email.value), pw=pass.value;
    if(hp.value){ say("İşlem reddedildi."); return; }
    if(!validEmail(em)||!pw){ say("E-posta ve şifreyi doldur."); return; }
    if(!chk.checked){ say("Devam etmek için Gizlilik ve Çerez Politikası’nı kabul etmelisin."); return; }
    lock(true); S.busy=true; say("");
    try{
      const cred=await signInWithEmailAndPassword(auth,em,pw);
      await loadProfile(cred.user);
      if(S.profile.banned){ await signOut(auth); resetSession(); S.busy=false; say("Bu hesap engellenmiş."); lock(false); return; }
      if(S.isAdmin){
        if(!normCode(code.value)){ await signOut(auth); resetSession(); S.busy=false; say("Bu hesap bir admin hesabı. Admin şifresini de girmen gerekiyor."); lock(false); return; }
        if(normCode(code.value)!==S.adminCode){ await signOut(auth); resetSession(); S.busy=false; say("Admin şifresi yanlış."); lock(false); return; }

      try{ await updateDoc(doc(db,"users",cred.user.uid),{lastLogin:Date.now(),logins:increment(1),consent:Date.now()}); }catch(e){}
      await addLog("login",S.isAdmin?"Admin girişi":"");

    const em=normEmail(email.value), pw=pass.value;

    if(!validEmail(em)){ say("Geçerli bir e-posta yaz."); return; }
    if(pw.length<6){ say("Şifre en az 6 karakter olmalı."); return; }
    if(parseInt(human.value,10)!==a+b){ say("İnsan doğrulaması yanlış. Toplamı doğru yaz."); return; }
    if(!chk.checked){ say("Devam etmek için Gizlilik ve Çerez Politikası’nı kabul etmelisin."); return; }
    if(asAdmin&&!(await adminCodeLooksRight(code.value))){ say("Admin şifresi yanlış. Admin kaydı yapılamaz."); return; }
    lock(true); S.busy=true; say("");

      S.busy=false; await afterAuth(cred.user);
    }catch(e){ S.busy=false; say(errMsg(e)); lock(false); }
  }

}

    box.append(h("div",{class:"cm"},
      h("div",{class:"meta"},h("span",null,h("b",null,S.isAdmin||c.uid===u.uid?c.email:maskEmail(c.email))," · ",fmtDate(c.at)),
        canDel?h("button",{class:"x",onclick:async()=>{ try{ await deleteDoc(doc(db,"comments",c.id)); }catch(e){ toast(errMsg(e)); } }},"Sil"):null),
      h("div",null,c.text)));
  });
  return box;
}

/* ===== Proje kartları ===== */
function projectCard(p){
  const dl=h("span",{class:"tag n"},"⬇ "+fmtCount(p.downloads||0));
  const count=S.comments.filter(c=>c.pid===p.id).length;
  const cmBtn=h("button",{class:"btn btn-ghost btn-sm cbtn",onclick:()=>{ S.openC=S.openC===p.id?null:p.id; render(); }},"💬 Yorumlar ("+count+")"+(S.openC===p.id?" ▲":" ▼"));
  const dlBtn=h("a",{class:"btn btn-gold btn-sm",href:p.link,target:"_blank",rel:"noopener noreferrer",onclick:()=>{
    updateDoc(doc(db,"projects",p.id),{downloads:increment(1)}).catch(()=>{});
  }},"⬇ İndir");
  const actions=h("div",{class:"actions"},dlBtn);
  const card=h("article",{class:"proj"},h("div",{class:"ico"},crownSvg()),h("h3",null,p.name),
    h("div",{class:"tags"},h("span",{class:"tag"},p.genre),h("span",{class:"tag n"},fmtSize(p.size)),dl),actions);
  if(S.isAdmin){
    const ci=h("input",{type:"text",placeholder:"Sayaç: 100K, 50K, 1.5M…",value:fmtCount(p.downloads||0)});
    actions.append(
      h("button",{class:"btn btn-ghost btn-sm",onclick:()=>{S.editing=p.id;S.tab="projects";render();window.scrollTo({top:0,behavior:"smooth"});}},"Düzenle"),
      confirmBtn("Sil","btn-danger btn-sm",async()=>{ try{ await deleteDoc(doc(db,"projects",p.id)); toast("Proje silindi"); }catch(e){ toast(errMsg(e)); } }));
    card.append(h("div",{class:"counter"},ci,h("button",{class:"btn btn-ghost btn-sm",onclick:async()=>{
      const v=parseCount(ci.value); if(isNaN(v)){ toast("Geçersiz sayı. Örn: 100K"); return; }
      try{ await updateDoc(doc(db,"projects",p.id),{downloads:v}); toast("Sayaç "+fmtCount(v)+" yapıldı"); }catch(e){ toast(errMsg(e)); }
    }},"Ayarla")));
  }
  card.append(cmBtn);
  if(S.openC===p.id) card.append(commentsBlock(p));
  return card;
}
function projectsGrid(){
  const all=S.projects;
  const genres=[...new Set(all.map(p=>p.genre))].sort((a,b)=>a.localeCompare(b,"tr"));
  const frag=h("div"); const grid=h("div",{class:"grid"});
  const search=h("input",{type:"search",placeholder:"Proje ara…",value:S.filter});
  const sel=h("select",null,h("option",{value:""},"Tüm türler"),genres.map(g=>h("option",{value:g,selected:g===S.genre},g)));
  function paint(){
    const q=S.filter.trim().toLocaleLowerCase("tr");
    const list=all.filter(p=>(!q||p.name.toLocaleLowerCase("tr").includes(q))&&(!S.genre||p.genre===S.genre));
    grid.replaceChildren();
    if(!S.loaded) grid.append(h("div",{class:"loading",style:"grid-column:1/-1"},"Projeler yükleniyor…"));
    else if(!all.length) grid.append(h("div",{class:"empty",style:"grid-column:1/-1"},h("div",{class:"big"},"👑"),"Henüz proje eklenmedi. Çok yakında burada olacak!"));
    else if(!list.length) grid.append(h("div",{class:"empty",style:"grid-column:1/-1"},"Aramana uyan proje bulunamadı."));
    else list.forEach(p=>grid.append(projectCard(p)));
  }
  search.addEventListener("input",()=>{S.filter=search.value;paint();});
  sel.addEventListener("change",()=>{S.genre=sel.value;paint();});
  frag.append(h("div",{class:"filters"},search,sel),grid); paint(); return frag;
}
function projectsView(){
  return h("div",null,h("div",{class:"section-title"},h("div",null,h("h2",{class:"gold-text"},"Projelerim"),h("p",null,S.projects.length+" proje · indirmek için karttaki butona tıkla, yorum bırakabilirsin"))),projectsGrid());
}

/* ===== Admin panel ===== */
function adminView(){
  const wrap=h("div"); const tabs=[["projects","Projeler"],["members","Üyeler"],["activity","Giriş Kayıtları"]];
  wrap.append(h("div",{class:"section-title"},h("div",null,h("h2",{class:"gold-text"},"Admin Panel"),h("p",null,"Projeleri, üyeleri ve giriş kayıtlarını buradan yönet."))),
    h("div",{class:"tabs"},tabs.map(([k,n])=>h("button",{class:"btn btn-ghost btn-sm"+(S.tab===k?" on":""),onclick:()=>{S.tab=k;render();}},n))));
  if(S.tab==="members") wrap.append(membersTab());
  else if(S.tab==="activity") wrap.append(activityTab());
  else wrap.append(projectsTab());
  return wrap;
}
function projectsTab(){
  const editing=S.editing?S.projects.find(p=>p.id===S.editing):null;
  const msg=h("div"); const say=(t,ok)=>msg.replaceChildren(t?h("div",{class:"msg "+(ok?"ok":"err")},t):"");
  const name=h("input",{type:"text",placeholder:"Örn: Altın Savaşçı",maxlength:"80",value:editing?editing.name:""});
  const size=h("input",{type:"number",min:"0",step:"any",placeholder:"Örn: 250",value:editing?editing.size:""});
  const genre=h("input",{type:"text",list:"genres",placeholder:"Örn: Aksiyon",maxlength:"40",value:editing?editing.genre:""});
  const dlist=h("datalist",{id:"genres"},[...new Set(S.projects.map(p=>p.genre))].map(g=>h("option",{value:g})));
  const link=h("input",{type:"url",placeholder:"https://…indirme linki",value:editing?editing.link:""});
  const dcount=h("input",{type:"text",placeholder:"Örn: 100K, 50K, 1.5M",value:editing?fmtCount(editing.downloads||0):"0"});
  const saveBtn=h("button",{class:"btn btn-gold"},editing?"Kaydet":"Projeyi Ekle");
  saveBtn.addEventListener("click",async()=>{
    const n=name.value.trim(),g=genre.value.trim(),s=parseFloat(size.value),l=safeUrl(link.value),d=parseCount(dcount.value);
    if(!n){say("Proje adını yaz.");return;}
    if(isNaN(s)||s<0){say("Boyutu MB olarak sayı şeklinde yaz.");return;}
    if(!g){say("Türü yaz.");return;}
    if(!l){say("İndirme linki geçerli bir https:// adresi olmalı.");return;}
    if(isNaN(d)){say("İndirme sayısı geçersiz. Örn: 100K veya 50000");return;}
    saveBtn.disabled=true;
    try{
      if(editing){ await updateDoc(doc(db,"projects",editing.id),{name:n,size:s,genre:g,link:l,downloads:d}); toast("Proje güncellendi"); }
      else{ await addDoc(collection(db,"projects"),{name:n,size:s,genre:g,link:l,downloads:d,createdAt:Date.now()}); toast("Proje eklendi 👑"); }
      S.editing=null; render();
    }catch(e){ say(errMsg(e)); saveBtn.disabled=false; }
  });
  const form=h("div",{class:"gcard panel"},
    h("h2",{class:"gold-text"},editing?"Projeyi Düzenle":"Yeni Proje Ekle"),
    h("p",{class:"sub"},"Proje adı, boyutu (MB), türü, indirme linki ve indirme sayacı. Eklediğin proje tüm üyelere anında görünür."),msg,
    h("div",{class:"field"},h("label",{class:"l"},"Proje adı"),name),
    h("div",{class:"row2"},h("div",{class:"field"},h("label",{class:"l"},"Boyut (MB)"),size),h("div",{class:"field"},h("label",{class:"l"},"Tür"),genre,dlist)),
    h("div",{class:"field"},h("label",{class:"l"},"İndirme linki"),link),
    h("div",{class:"field"},h("label",{class:"l"},"İndirme sayacı"),dcount,h("div",{class:"hint"},"İstediğin değeri yazabilirsin: 50K, 100K, 1.5M… Üyeler indirdikçe bu sayıya eklenir.")),
    h("div",{class:"tools"},saveBtn,editing?h("button",{class:"btn btn-ghost",onclick:()=>{S.editing=null;render();}},"Vazgeç"):null));
  return h("div",null,form,
    h("div",{class:"section-title"},h("div",null,h("h2",{class:"gold-text",style:"font-size:26px"},"Eklenen Projeler"),h("p",null,S.projects.length+" proje · her kartta sayacı hızlıca ayarlayabilirsin"))),
    projectsGrid());
}
function membersTab(){
  const wrap=h("div"); const body=h("div"); let q="";
  const refresh=h("button",{class:"btn btn-ghost btn-sm",onclick:load},"↻ Yenile");
  wrap.append(h("div",{class:"tools",style:"margin:0 0 14px"},refresh),body);
  let all=[];
  async function load(){
    body.replaceChildren(h("div",{class:"loading"},"Üyeler yükleniyor…"));
    try{ const snap=await getDocs(collection(db,"users")); all=snap.docs.map(d=>({uid:d.id,...d.data()})); paint(); }
    catch(e){ body.replaceChildren(h("div",{class:"msg err"},errMsg(e))); }
  }
  function paint(){
    body.replaceChildren();
    const sus=all.map(x=>({u:x,r:suspicion(x)}));
    const day=Date.now()-864e5;
    body.append(h("div",{class:"stats"},
      h("div",{class:"stat"},h("b",{class:"gold-text"},all.length),h("span",null,"Toplam üye")),
      h("div",{class:"stat"},h("b",{class:"gold-text"},all.filter(x=>(x.lastLogin||0)>day).length),h("span",null,"Son 24 saatte giriş")),
      h("div",{class:"stat"},h("b",{class:"gold-text"},sus.filter(s=>s.r.length).length),h("span",null,"Şüpheli (tahmini)")),
      h("div",{class:"stat"},h("b",{class:"gold-text"},all.filter(x=>x.banned).length),h("span",null,"Engelli üye"))));
    body.append(h("p",{style:"color:var(--muted);font-size:13px;margin-bottom:14px;line-height:1.5"},"“Şüpheli” işaretleri tahminidir: geçici e-posta servisi, rastgele veya rakamlı adres gibi sinyallere bakar. Kesin bot kanıtı değildir; karar sende. Şüpheli gördüğünü engelleyebilirsin."));
    const search=h("input",{type:"search",placeholder:"E-posta ara…",value:q,style:"padding:11px 14px;border-radius:11px;border:1px solid rgba(var(--ar),.3);background:var(--inp);color:var(--text);font-family:inherit;width:100%;max-width:340px;margin-bottom:14px;outline:none"});
    const tb=h("tbody");
    const rowsPaint=()=>{
      tb.replaceChildren(); const s=q.trim().toLowerCase();
      const rows=sus.filter(x=>!s||String(x.u.email).includes(s)).sort((a,b)=>(b.u.createdAt||0)-(a.u.createdAt||0));
      if(!rows.length){ tb.append(h("tr",null,h("td",{colspan:"6",style:"color:var(--muted);text-align:center;padding:28px"},"Üye bulunamadı."))); return; }
      rows.forEach(({u:x,r})=>{
        const me=x.uid===S.authUser.uid;
        const badges=h("td",null);
        if(me) badges.append(h("span",{class:"badge"},"👑 Sen"));
        if(x.banned) badges.append(h("span",{class:"badge bad"},"Engelli"));
        if(!me) r.forEach(t=>badges.append(h("span",{class:"badge warn",title:"Tahmini işaret; kesin bot kanıtı değildir"},"⚠ "+t)));
        if(!me&&!r.length&&!x.banned) badges.append(h("span",{class:"badge good"},"Temiz görünüyor"));
        const act=h("td",null);
        if(!me) act.append(h("button",{class:"btn btn-ghost btn-sm",onclick:async()=>{ try{ await updateDoc(doc(db,"users",x.uid),{banned:!x.banned}); x.banned=!x.banned; toast(x.banned?"Üye engellendi":"Engel kaldırıldı"); paint(); }catch(e){ toast(errMsg(e)); } }},x.banned?"Engeli Kaldır":"Engelle"));
        else act.append("—");
        tb.append(h("tr",null,h("td",{class:"em"},x.email),h("td",null,fmtDate(x.createdAt)),h("td",null,fmtDate(x.lastLogin)),h("td",null,String(x.logins||0)),badges,act));
      });
    };
    search.addEventListener("input",()=>{q=search.value;rowsPaint();}); rowsPaint();
    body.append(search,h("div",{class:"twrap"},h("table",null,h("thead",null,h("tr",null,["E-posta","Kayıt","Son giriş","Giriş sayısı","Durum","İşlem"].map(t=>h("th",null,t)))),tb)));
  }
  load(); return wrap;
}
function activityTab(){
  const wrap=h("div"); const body=h("div"); const names={login:"✅ Giriş",register:"🆕 Kayıt"};
  async function load(){
    body.replaceChildren(h("div",{class:"loading"},"Kayıtlar yükleniyor…"));
    try{
      const snap=await getDocs(query(collection(db,"logs"),orderBy("at","desc"),limit(200)));
      const box=h("div",{class:"log twrap"});
      if(snap.empty) box.append(h("div",{style:"color:var(--muted)"},"Henüz kayıt yok."));
      snap.docs.forEach(d=>{ const l=d.data(); box.append(h("div",null,h("span",{class:"t"},fmtDate(l.at)),h("span",null,names[l.type]||l.type),h("b",{style:"word-break:break-all"},l.email),h("span",{style:"color:var(--muted)"},l.note))); });
      body.replaceChildren(box,h("div",{class:"tools"},confirmBtn("Kayıtları Temizle","btn-danger btn-sm",async()=>{ try{ await Promise.all(snap.docs.map(d=>deleteDoc(d.ref))); toast("Kayıtlar temizlendi"); load(); }catch(e){ toast(errMsg(e)); } })));
    }catch(e){ body.replaceChildren(h("div",{class:"msg err"},errMsg(e))); }
  }
  wrap.append(h("p",{style:"color:var(--muted);font-size:13px;margin-bottom:14px"},"Son 200 hareket: girişler ve kayıtlar."),h("div",{class:"tools",style:"margin:0 0 14px"},h("button",{class:"btn btn-ghost btn-sm",onclick:load},"↻ Yenile")),body);
  load(); return wrap;
}

/* ===== Ana çizim ===== */
function render(){
  renderNav();
  const app=$("#app"); app.replaceChildren();
  if(S.busy&&!S.authUser){ app.append(authView()); return; }
  if(!S.authUser||!S.profile) app.append(authView());
  else if(S.view==="admin"&&S.isAdmin) app.append(adminView());
  else{ S.view="projects"; app.append(projectsView()); }
}
$("#brand").addEventListener("click",()=>{ if(S.authUser&&S.profile){ S.view="projects"; S.editing=null; render(); } });
$("#f_priv").addEventListener("click",privacyModal);
$("#f_cook").addEventListener("click",()=>{ store.set(K.cookie,null); loadPrefs(); renderCookie(); });
$("#yr").textContent=new Date().getFullYear();
loadPrefs(); renderCookie();
</script>
